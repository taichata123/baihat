<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chata – Gọi món (bản phác)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:wght@700&display=swap">
<style>
  :root{--bg:#F4F6F1;--card:#fff;--sunk:#E9EEE7;--ink:#1A2926;--muted:#5A6B65;--line:#DCE4DD;
    --ac:#0D6C68;--ac-d:#0A5552;--ac-s:#D5ECE8;--sun:#F2B544;--sun-s:#FBEFD3;--bad:#B23A2E;
    --fb:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45}
  button,input{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .demo{display:flex;justify-content:center;gap:4px;background:#1A2926;padding:6px}
  .demo button{border:none;background:none;color:#cfe;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
  .demo button.on{background:var(--sun);color:#2b2118}
  /* đầu trang gọn */
  .top{background:var(--ac);color:#EAF6F4;padding:12px 16px 12px}
  .top .row{display:flex;align-items:baseline;gap:8px}
  .brand{font-family:Lora,Georgia,serif;font-weight:700;font-size:21px}
  .top small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
  .top p{margin:4px 0 0;font-size:13px;opacity:.92}
  /* thanh nhóm luôn ở trên */
  .cats{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 12px 8px;scrollbar-width:none;border-bottom:1px solid var(--line)}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .sec{padding:4px 12px 0;scroll-margin-top:58px}
  .sec h2{font-size:17px;font-weight:800;margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
  .sec h2 small{font-weight:500;color:var(--muted);font-size:13px}
  /* Bản A: lưới 2 cột */
  .ga{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ca{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative}
  .ca .im{aspect-ratio:1/1;background:#EEF2EC center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:42px}
  .ca .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
  .ca .nm{font-weight:700;font-size:14.5px;line-height:1.3}
  .ca .sb{font-size:12px;color:var(--muted)}
  .ca .pr{margin-top:auto;padding-top:4px;display:flex;align-items:center;justify-content:space-between}
  .ca .pr b{font-size:15px;color:var(--ac)}
  /* Bản B: danh sách hình nhỏ */
  .gb{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cb{display:flex;gap:12px;padding:10px;border-top:1px solid var(--line);cursor:pointer;position:relative;align-items:center}
  .cb:first-child{border-top:none}
  .cb .im{width:78px;height:78px;flex:none;border-radius:10px;background:#EEF2EC center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px}
  .cb .tx{flex:1;min-width:0}
  .cb .nm{font-weight:700;font-size:15.5px;line-height:1.3}
  .cb .sb{font-size:12.5px;color:var(--muted)}
  .cb .pb{font-weight:700;color:var(--ac);margin-top:3px}
  .plus{width:36px;height:36px;flex:none;border-radius:50%;border:none;background:var(--ac);color:#fff;font-size:22px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .qy{position:absolute;top:8px;left:8px;background:var(--sun);color:#2b2118;font-weight:800;font-size:12.5px;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .cb .qy{top:6px;left:6px}
  .tag{display:inline-block;font-size:11px;font-weight:700;background:var(--ac-s);color:var(--ac-d);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
  .pad{height:110px}
  /* giỏ dưới */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
  .bar button{display:flex;width:100%;max-width:616px;margin:0 auto;align-items:center;gap:10px;background:var(--ac);color:#fff;border:none;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 8px 22px rgba(13,108,104,.3)}
  .bar button:disabled{background:#9db5b2;box-shadow:none}
  .bar .ct{background:#fff;color:var(--ac);border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 7px}
  .bar .go{margin-left:auto}
  /* bảng chọn trượt lên */
  .mask{position:fixed;inset:0;z-index:50;background:rgba(15,30,28,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(14px + env(safe-area-inset-bottom));position:relative;animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:16px;cursor:pointer;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .hero{height:190px;background:#EEF2EC center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:60px}
  .sh{padding:14px 16px 0}
  .sh h3{margin:0;font-size:19px;font-weight:800}
  .sh .pp{color:var(--ac);font-weight:800;font-size:17px;margin-top:2px}
  .lab{font-size:13.5px;font-weight:700;margin:14px 0 7px;color:var(--ink)}
  .lab small{font-weight:500;color:var(--muted)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .op{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14.5px}
  .op small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .op.on{border-color:var(--ac);background:var(--ac-s);color:var(--ac-d)}
  .qn{border:1px solid var(--line);background:#F7F9F6;border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
  .qn.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .note{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FBFCFA;margin-top:8px}
  .foot{display:flex;gap:10px;align-items:center;padding:16px 16px 0}
  .stp{display:flex;align-items:center;gap:6px}
  .stp button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--ac);cursor:pointer}
  .stp b{min-width:24px;text-align:center;font-size:17px}
  .addb{flex:1;border:none;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:16px;padding:14px 12px;cursor:pointer}
  /* giỏ */
  .ci{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start}
  .ci .im{width:52px;height:52px;flex:none;border-radius:8px;background:#EEF2EC center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px}
  .ci .tx{flex:1;min-width:0}
  .ci .nm{font-weight:700}
  .ci .nt{font-size:13px;color:var(--muted)}
  .ci .ed{font-size:13px;color:var(--ac);font-weight:600;cursor:pointer;margin-top:2px;display:inline-block}
  .ci .rt{text-align:right}
  .ci .rt b{display:block;margin-bottom:6px}
  .ci .stp button{width:32px;height:32px;font-size:17px}
  .tot{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;border-top:1px dashed var(--line);margin-top:4px}
  .tot b{font-size:21px;color:var(--ac)}
  .inp{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FBFCFA}
  .send{width:calc(100% - 32px);margin:14px 16px 0;padding:15px;border:none;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1A2926;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:.95}
  @media(min-width:640px){.ga{grid-template-columns:repeat(3,1fr)}.wrapc{max-width:640px;margin:0 auto}}
</style>
</head>
<body>
<div class="demo"><button type="button" data-v="A" class="on">Bản A · Lưới</button><button type="button" data-v="B">Bản B · Danh sách</button></div>
<div class="wrapc">
<div class="top">
  <div class="row"><span class="brand">Chata</span><small>Gọi món tại bàn</small></div>
  <p>Chọn món → gửi đơn → ra quầy đọc mã để thanh toán.</p>
</div>
<div class="cats" id="cats"></div>
<div id="list"></div>
<div class="pad"></div>
</div>
<div class="bar"><button type="button" id="cartBtn" disabled><span class="ct" id="cartN">0</span><span id="cartT">Chưa chọn món</span><span class="go" id="cartS"></span></button></div>

<div class="mask" id="itemM" hidden><div class="sheet">
  <button class="x" type="button" data-close>✕</button>
  <div class="hero" id="iHero"></div>
  <div class="sh">
    <h3 id="iName"></h3><div class="pp" id="iPrice"></div>
    <div id="iSizeW"><div class="lab">Chọn size</div><div class="opts" id="iSize"></div></div>
    <div class="lab" id="iQnL">Ghi chú <small>(chọn nhanh hoặc tự gõ)</small></div>
    <div class="opts" id="iQn"></div>
    <input class="note" id="iNote" maxlength="60" placeholder="VD: ít ngọt, cấp 3…">
  </div>
  <div class="foot"><div class="stp"><button type="button" id="iMinus">−</button><b id="iQ">1</b><button type="button" id="iPlus">+</button></div><button class="addb" type="button" id="iAdd"></button></div>
</div></div>

<div class="mask" id="cartM" hidden><div class="sheet" style="padding-top:14px">
  <button class="x" type="button" data-close>✕</button>
  <h3 style="margin:4px 16px 10px;font-size:19px;font-weight:800">Đơn của bạn</h3>
  <div id="cLines"></div>
  <div class="tot"><span>Tổng cộng</span><b id="cTot"></b></div>
  <div style="padding:0 16px">
    <div class="lab">Tên của bạn <small>(để quầy gọi)</small></div><input class="inp" id="cName" placeholder="VD: Lan">
    <div class="lab">Số thẻ rung / bàn <small>(nếu có)</small></div><input class="inp" id="cTbl" inputmode="numeric" placeholder="VD: 12">
  </div>
  <button class="send" type="button" id="cSend">Gửi đơn</button>
</div></div>
<div class="toast" id="toast"></div>

function drawItem(){
  var t = CUR;
  $('iSize').innerHTML = t.items.map(function(m, k){ return '<button class="op' + (m === SEL ? ' on' : '') + '" type="button" data-s="' + k + '">' + esc(m.s || m.n) + '<small>' + money(m.p) + 'đ</small></button>'; }).join('');
  $('iPrice').textContent = money(SEL.p) + 'đ'; $('iQ').textContent = Q; $('iAdd').textContent = 'Thêm vào đơn · ' + money(SEL.p * Q) + 'đ';
  Array.prototype.forEach.call($('iQn').children, function(b){ b.classList.toggle('on', QN.indexOf(b.getAttribute('data-qn')) >= 0); });
}
function noteText(){ var free = $('iNote').value.trim(); return QN.concat(free ? [free] : []).join(', '); }
$('iSize').onclick = function(e){ var b = e.target.closest('[data-s]'); if (b) { SEL = CUR.items[+b.getAttribute('data-s')]; drawItem(); } };
$('iQn').onclick = function(e){ var b = e.target.closest('[data-qn]'); if (!b) return; var x = b.getAttribute('data-qn'), i = QN.indexOf(x);
  if (i >= 0) QN.splice(i, 1); else { if (/^Cấp /.test(x)) QN = QN.filter(function(y){ return !/^Cấp /.test(y); }); if (/đá$/.test(x)) QN = QN.filter(function(y){ return !/đá$/.test(y); }); QN.push(x); } drawItem(); };
$('iMinus').onclick = function(){ if (Q > 1) { Q--; drawItem(); } };
$('iPlus').onclick = function(){ Q++; drawItem(); };
$('iAdd').onclick = function(){ addCart(SEL, Q, noteText()); $('itemM').hidden = true; };
/* giỏ */
function drawCart(){
  $('cLines').innerHTML = CART.map(function(c, k){
    return '<div class="ci"><div class="im"' + (c.img ? ' style="background-image:url(\'' + esc(c.img) + '\')"' : '') + '>' + (c.img ? '' : (ICO[c.dg] || '🍽')) + '</div><div class="tx"><div class="nm">' + esc(c.n) + '</div>' + (c.t ? '<div class="nt">✎ ' + esc(c.t) + '</div>' : '') +
      '<span class="ed" data-ed="' + k + '">' + (c.t ? 'Sửa ghi chú' : '+ Ghi chú') + '</span></div><div class="rt"><b>' + money(c.p * c.q) + 'đ</b><div class="stp"><button type="button" data-m="' + k + '">−</button><b>' + c.q + '</b><button type="button" data-a="' + k + '">+</button></div></div></div>';
  }).join('');
  $('cTot').textContent = money(CART.reduce(function(s, c){ return s + c.q * c.p; }, 0)) + 'đ';
}
$('cLines').onclick = function(e){
  var b;
  if ((b = e.target.closest('[data-m]'))) { var k = +b.getAttribute('data-m'); if (--CART[k].q <= 0) CART.splice(k, 1); }
  else if ((b = e.target.closest('[data-a]'))) CART[+b.getAttribute('data-a')].q++;
  else if ((b = e.target.closest('[data-ed]'))) { var c = CART[+b.getAttribute('data-ed')], v = prompt('Ghi chú cho ' + c.n, c.t); if (v != null) c.t = v.trim().slice(0, 60); }
  else return;
  drawBar(); draw(); if (!CART.length) $('cartM').hidden = true; else drawCart();
};
$('cartBtn').onclick = function(){ drawCart(); $('cartM').hidden = false; };
$('cSend').onclick = function(){ toast('Bản phác: chưa gửi đơn thật'); };
document.querySelectorAll('[data-close]').forEach(function(b){ b.onclick = function(){ b.closest('.mask').hidden = true; }; });
document.querySelectorAll('.mask').forEach(function(m){ m.addEventListener('click', function(e){ if (e.target === m) m.hidden = true; }); });
/* bấm thẻ = mở bảng chọn; bấm + : món 1 loại / món chỉ khác size thì thêm ngay (size M), món nhiều loại thì mở bảng */
$('list').onclick = function(e){
  var p = e.target.closest('[data-p]'), t;
  if (p) { t = tileOf(p.getAttribute('data-p')); if (kinds(t)) return openItem(t); return addCart(defItem(t), 1, ''); }
  var c = e.target.closest('[data-t]'); if (c) openItem(tileOf(c.getAttribute('data-t')));
};
$('cats').onclick = function(e){ var b = e.target.closest('[data-g]'); if (!b) return; var s = $('g' + b.getAttribute('data-g')); window.scrollTo({ top: s.offsetTop - $('cats').offsetHeight + 2, behavior: 'smooth' }); };
function markCat(){
  var y = window.scrollY + $('cats').offsetHeight + 20, on = 0;
  GROUPS.forEach(function(g, i){ var s = $('g' + i); if (s && s.offsetTop <= y) on = i; });
  Array.prototype.forEach.call($('cats').children, function(c, i){ var o = i === on; if (o !== c.classList.contains('on')) { c.classList.toggle('on', o); if (o) c.scrollIntoView({ inline: 'center', block: 'nearest' }); } });
}
window.addEventListener('scroll', markCat, { passive: true });
document.querySelector('.demo').onclick = function(e){ var b = e.target.closest('[data-v]'); if (!b) return; V = b.getAttribute('data-v'); document.querySelectorAll('.demo button').forEach(function(x){ x.classList.toggle('on', x === b); }); draw(); };
draw(); drawBar();
</script>
</body>
</html>
